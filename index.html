<style>
:root{
  --bg:#ECEFEA; --surface:#F8FAF6; --ink:#1B2822; --muted:#5C6B63; --line:#CBD3CB;
  --stamp:#2A4B9A; --stamp-soft:#DFE6F5; --loan:#9A5B10; --loan-soft:#F4E6CC; --danger:#A3322B;
  --display:"Zilla Slab",Georgia,serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#121815; --surface:#1A221E; --ink:#E6ECE6; --muted:#97A69D; --line:#2F3B35;
  --stamp:#8FAAF0; --stamp-soft:#1F2A47; --loan:#E5AE5C; --loan-soft:#3A2C14; --danger:#F08A82; color-scheme:dark } }
html{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
[hidden]{display:none!important}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:28px 64px;display:flex;flex-direction:column;gap:40px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,7vw,52px);line-height:1;margin:0;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:700;font-size:24px;margin:0;text-wrap:balance}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
a{color:var(--stamp)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}

header{display:flex;flex-wrap:wrap;gap:20px 32px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:20px}
header .sub{margin:6px 0 0;color:var(--muted)}
.next{display:flex;flex-direction:column;gap:2px;min-width:0}
.next .date{font-family:var(--display);font-weight:700;font-size:22px}
.next .in{font-family:var(--mono);font-size:13px;color:var(--stamp)}

.head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.head .count{font-family:var(--mono);font-size:13px;color:var(--muted);margin-left:8px}
.btn{border:1px solid var(--ink);background:transparent;border-radius:3px;padding:6px 12px;font-weight:500}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.primary{background:var(--stamp);border-color:var(--stamp);color:var(--bg)}
.btn.small{padding:3px 9px;font-size:13px}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.danger:hover{background:var(--danger);color:var(--bg)}
.link{border:0;background:none;padding:0;color:var(--stamp);text-decoration:underline;font-size:13px}
.empty{border:1px dashed var(--line);border-radius:3px;padding:18px;color:var(--muted)}

/* Mitschrift */
.live{background:var(--surface);border:1px solid var(--stamp);border-radius:3px;padding:16px;display:flex;flex-direction:column;gap:12px}
.live .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.live select{border:1px solid var(--line);background:var(--bg);border-radius:3px;padding:5px 8px;min-width:0}
.live textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);border-radius:3px;padding:8px 10px;min-height:72px;resize:vertical}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.notes li{border-left:3px solid var(--line);padding-left:10px}
.notes .by{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.notes .tx{white-space:pre-wrap;overflow-wrap:anywhere}

.loans{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.loan{background:var(--loan-soft);border:1px dashed var(--loan);border-radius:3px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.loan .t{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.2}
.loan .who{font-weight:600}
.loan .who .arrow{color:var(--loan);padding:0 4px}
.loan .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.loan .since{font-family:var(--mono);font-size:12px;color:var(--loan)}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:3px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
#q{flex:1 1 160px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:5px 10px}
.books{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.book{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.book .t{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.25}
.book .a{color:var(--muted)}
.book .meta{font-size:13px;color:var(--muted);margin-top:3px}
.book .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:13px}
.pill{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;border-radius:2px;padding:2px 7px;white-space:nowrap}
.pill.v{background:var(--stamp-soft);color:var(--stamp)}
.pill.e{border:1px solid var(--line);color:var(--muted)}
.pill.l{background:var(--loan-soft);color:var(--loan)}

.meets{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.meet{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px}
.meet.upcoming{border-color:var(--stamp)}
.meet .d{font-family:var(--display);font-weight:700;font-size:18px}
.meet .n{margin:0}
.meet ul{margin:4px 0 0;padding-left:18px;font-size:14px}

dialog{background:var(--surface);color:var(--ink);border:1px solid var(--ink);border-radius:4px;padding:20px;width:min(520px,calc(100vw - 32px));box-sizing:border-box}
dialog::backdrop{background:rgba(0,0,0,.5)}
form.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
form.grid .full{grid-column:1/-1}
@media (max-width:480px){form.grid{grid-template-columns:1fr}}
form label{display:flex;flex-direction:column;gap:4px;min-width:0}
form input,form select,form textarea{border:1px solid var(--line);background:var(--bg);border-radius:3px;padding:6px 8px;min-width:0;width:100%;box-sizing:border-box}
#bSugg{display:flex;flex-direction:column;gap:6px;font-size:14px}
.sugg{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:3px;padding:7px 10px}
.sugg:hover{border-color:var(--stamp)}
.sugg button{border:0;background:none;padding:0;text-align:left;min-width:0}
.sugg b{font-family:var(--display);font-size:16px}
.sugg a{white-space:nowrap}
.actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:6px}
.actions div{display:flex;gap:8px}
#note{font-size:13px;color:var(--danger);min-height:1em}

.login{max-width:380px;margin:12vh auto 0;padding-inline:16px;display:flex;flex-direction:column;gap:16px}
.login form{display:flex;flex-direction:column;gap:12px}
.foot{font-size:13px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
</style>
</head>
<body>

<div class="login" id="login" hidden>
  <div><div class="label">Buchklub</div><h1>Seitenstecher</h1></div>
  <form id="loginForm">
    <label><span class="label">Wer bist du?</span><input id="lName" list="people" required autocomplete="off"></label>
    <label><span class="label">Klub-Passwort</span><input id="lPass" type="password" required autocomplete="current-password"></label>
    <button class="btn primary">Anmelden</button>
    <div id="lErr" style="color:var(--danger);font-size:13px"></div>
  </form>
</div>

<div class="wrap" id="app" hidden>
  <header>
    <div>
      <div class="label">Buchklub</div>
      <h1>Seitenstecher</h1>
      <p class="sub" id="members"></p>
    </div>
    <div class="next" id="next"></div>
  </header>

  <section>
    <div class="head"><h2>Mitschrift</h2><button class="btn primary" id="addBook">Buch eintragen</button></div>
    <div class="live">
      <div class="row"><span class="label">Treffen</span><select id="liveMeet" aria-label="Treffen für die Mitschrift"></select></div>
      <form id="noteForm">
        <textarea id="noteText" placeholder="Notiz zum Treffen: Gedanken, Zitate, Empfehlungen …" aria-label="Notiz"></textarea>
        <div class="row" style="justify-content:space-between;margin-top:8px">
          <span class="muted" style="font-size:13px">als <b id="meName"></b></span>
          <button class="btn">Notiz speichern</button>
        </div>
      </form>
      <ul class="notes" id="notes"></ul>
    </div>
  </section>

  <section>
    <div class="head"><h2>Verliehen<span class="count" id="loanCount"></span></h2></div>
    <div class="loans" id="loans"></div>
  </section>

  <section>
    <div class="head"><h2>Bücher<span class="count" id="bookCount"></span></h2></div>
    <div class="tools">
      <button class="chip" data-f="alle" aria-pressed="true">Alle</button>
      <button class="chip" data-f="vorgestellt" aria-pressed="false">Vorgestellt</button>
      <button class="chip" data-f="erwaehnt" aria-pressed="false">Erwähnt</button>
      <button class="chip" data-f="verliehen" aria-pressed="false">Verliehen</button>
      <input id="q" type="search" placeholder="Titel, Autor, Person" aria-label="Bücher durchsuchen">
    </div>
    <ul class="books" id="books"></ul>
  </section>

  <section>
    <div class="head"><h2>Treffen<span class="count" id="meetCount"></span></h2><button class="btn" id="addMeet">Treffen eintragen</button></div>
    <ul class="meets" id="meets"></ul>
  </section>

  <p id="note"></p>
  <div class="foot"><span id="who"></span><button class="link" id="logout">Abmelden</button></div>
</div>

<datalist id="people"></datalist>

<dialog id="bookDlg">
  <form class="grid" id="bookForm">
    <h2 class="full" id="bookDlgTitle">Buch</h2>
    <label class="full"><span class="label">Titel</span><input id="bTitle" required autocomplete="off" placeholder="z. B. Peterchen"></label>
    <div class="full" id="bSugg" hidden></div>
    <label class="full"><span class="label">Autor</span><input id="bAuthor" autocomplete="off"></label>
    <label><span class="label">Status</span><select id="bStatus"><option value="vorgestellt">Vorgestellt</option><option value="erwaehnt">Erwähnt</option></select></label>
    <label><span class="label">Von wem</span><input id="bBy" list="people"></label>
    <label><span class="label">Treffen</span><select id="bMeet"></select></label>
    <label><span class="label">Besitzer</span><input id="bOwner" list="people"></label>
    <label><span class="label">Verliehen an</span><input id="bLoanTo" list="people" placeholder="leer = nicht verliehen"></label>
    <label><span class="label">Verliehen seit</span><input id="bLoanSince" type="date"></label>
    <label class="full"><span class="label">Notiz</span><textarea id="bNote" rows="2"></textarea></label>
    <div class="actions full">
      <button type="button" class="btn danger" id="bDel">Löschen</button>
      <div><button type="button" class="btn" data-close>Abbrechen</button><button class="btn primary">Speichern</button></div>
    </div>
  </form>
</dialog>

<dialog id="meetDlg">
  <form class="grid" id="meetForm">
    <h2 class="full" id="meetDlgTitle">Treffen</h2>
    <label><span class="label">Datum</span><input id="mDate" type="date" required></label>
    <label><span class="label">Uhrzeit</span><input id="mTime" type="time"></label>
    <label class="full"><span class="label">Teilnehmer (mit Komma getrennt)</span><input id="mWho"></label>
    <label class="full"><span class="label">Beschreibung</span><textarea id="mNote" rows="3"></textarea></label>
    <div class="actions full">
      <button type="button" class="btn danger" id="mDel">Löschen</button>
      <div><button type="button" class="btn" data-close>Abbrechen</button><button class="btn primary">Speichern</button></div>
    </div>
  </form>
</dialog>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const fmt = (d, o) => d ? new Date(d + "T12:00").toLocaleDateString("de-DE", o || {weekday:"short", day:"numeric", month:"long", year:"numeric"}) : "";
const short = d => fmt(d, {day:"2-digit", month:"2-digit", year:"numeric"});
const amazon = (t, a) => "https://www.amazon.de/s?i=stripbooks&k=" + encodeURIComponent([t, a].filter(Boolean).join(" "));
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch {} } };

const configured = !SUPABASE_URL.startsWith("HIER") && !SUPABASE_KEY.startsWith("HIER");
const sb = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

let books = [], meets = [], notes = [], filter = store.get("ss-filter") || "alle", editBook = null, editMeet = null, liveId = null, me = store.get("ss-name") || "";

function people(){
  const s = new Set(MEMBERS);
  meets.forEach(m => (m.attendees || []).forEach(p => s.add(p)));
  books.forEach(b => [b.presented_by, b.owner, b.loaned_to].forEach(p => p && s.add(p)));
  return [...s].sort((a,b) => a.localeCompare(b, "de"));
}
const meetLabel = id => { const m = meets.find(x => x.id === id); return m ? short(m.date) : ""; };
const fail = msg => { $("note").textContent = msg; };
async function run(promise, msg){
  const { error } = await promise;
  if (error){ fail(msg + " (" + error.message + ")"); return false; }
  $("note").textContent = ""; await load(); return true;
}

async function load(){
  const [b, m, n] = await Promise.all([
    sb.from("books").select("*"), sb.from("meetings").select("*"), sb.from("notes").select("*").order("created_at", {ascending:false})
  ]);
  if (b.error || m.error || n.error){ fail("Daten konnten nicht geladen werden. Lade die Seite neu."); return; }
  books = b.data; meets = m.data; notes = n.data; render();
}

function render(){
  const ppl = people();
  $("people").innerHTML = ppl.map(p => `<option value="${esc(p)}">`).join("");
  $("members").textContent = ppl.join(" · ");
  $("meName").textContent = me; $("who").textContent = "Angemeldet als " + me;

  const t = today(), sorted = [...meets].sort((a,b) => a.date.localeCompare(b.date));
  const nx = sorted.find(m => m.date >= t);
  if (nx){
    const days = Math.round((new Date(nx.date+"T12:00") - new Date(t+"T12:00")) / 864e5);
    $("next").innerHTML = `<span class="label">Nächstes Treffen</span><span class="date">${esc(fmt(nx.date))}${nx.time ? ", " + esc(nx.time) + " Uhr" : ""}</span><span class="in">${days === 0 ? "heute" : days === 1 ? "morgen" : "in " + days + " Tagen"}</span>`;
  } else $("next").innerHTML = `<span class="label">Nächstes Treffen</span><span class="muted">Noch kein Termin eingetragen</span>`;

  // Mitschrift: heutiges Treffen, sonst das letzte vergangene, sonst das nächste
  if (!liveId || !meets.some(m => m.id === liveId)){
    const past = sorted.filter(m => m.date <= t);
    liveId = (sorted.find(m => m.date === t) || past[past.length - 1] || nx || {}).id || null;
  }
  $("liveMeet").innerHTML = [...sorted].reverse().map(m => `<option value="${esc(m.id)}">${esc(fmt(m.date))}</option>`).join("");
  if (liveId) $("liveMeet").value = liveId;
  $("noteForm").hidden = !liveId;
  const ln = notes.filter(n => n.meeting_id === liveId);
  $("notes").innerHTML = !liveId ? `<li class="empty" style="border-left:1px dashed var(--line)">Trag zuerst ein Treffen ein, dann kannst du mitschreiben.</li>`
    : ln.length ? ln.map(n => `<li><div class="by"><span>${esc(n.author)}</span><span>${esc(new Date(n.created_at).toLocaleString("de-DE", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"}))}</span>
        <button class="link" data-ndel="${esc(n.id)}">löschen</button></div><div class="tx">${esc(n.body)}</div></li>`).join("")
    : `<li class="muted">Noch keine Notizen zu diesem Treffen.</li>`;

  const out = books.filter(b => b.loaned_to).sort((a,b) => (a.loaned_since||"").localeCompare(b.loaned_since||""));
  $("loanCount").textContent = out.length || "";
  $("loans").innerHTML = out.length ? out.map(b => `
    <div class="loan">
      <div><div class="t">${esc(b.title)}</div><div class="muted">${esc(b.author)}</div></div>
      <div class="who">${esc(b.owner || "?")}<span class="arrow">→</span>${esc(b.loaned_to)}</div>
      <div class="foot"><span class="since">${b.loaned_since ? "seit " + esc(short(b.loaned_since)) : ""}</span>
      <button class="btn small" data-back="${esc(b.id)}">Zurückgegeben</button></div>
    </div>`).join("") : `<div class="empty">Gerade ist kein Buch verliehen. Eine Ausleihe trägst du direkt am Buch ein.</div>`;

  const q = $("q").value.trim().toLowerCase();
  const list = books.filter(b =>
    (filter === "alle" || (filter === "verliehen" ? !!b.loaned_to : b.status === filter)) &&
    (!q || [b.title,b.author,b.presented_by,b.owner,b.loaned_to,b.note].join(" ").toLowerCase().includes(q))
  ).sort((a,b) => (a.title||"").localeCompare(b.title||"", "de"));
  $("bookCount").textContent = books.length || "";
  document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x.dataset.f === filter));
  $("books").innerHTML = list.length ? list.map(b => {
    const meta = [
      b.presented_by ? (b.status === "erwaehnt" ? "erwähnt von " : "vorgestellt von ") + esc(b.presented_by) : "",
      meetLabel(b.meeting_id) ? "Treffen " + esc(meetLabel(b.meeting_id)) : "",
      b.owner ? "Besitzer: " + esc(b.owner) : ""
    ].filter(Boolean).join(" · ");
    return `<li class="book">
      <div><div class="t">${esc(b.title)}</div><div class="a">${esc(b.author)}</div>
        ${meta ? `<div class="meta">${meta}</div>` : ""}${b.note ? `<div class="meta">${esc(b.note)}</div>` : ""}</div>
      <div class="side">
        <span class="pill ${b.status === "erwaehnt" ? "e" : "v"}">${b.status === "erwaehnt" ? "Erwähnt" : "Vorgestellt"}</span>
        ${b.loaned_to ? `<span class="pill l">bei ${esc(b.loaned_to)}</span>` : ""}
        <button class="link" data-edit="${esc(b.id)}">Bearbeiten / verleihen</button>
        <a href="${amazon(b.title, b.author)}" target="_blank" rel="noopener">Bei Amazon kaufen</a>
      </div></li>`;
  }).join("") : `<li class="empty" style="margin-top:12px">${books.length ? "Kein Buch passt zu diesem Filter." : "Noch keine Bücher. Hier erscheinen alle vorgestellten und erwähnten Titel."}</li>`;

  $("meetCount").textContent = meets.length || "";
  $("meets").innerHTML = meets.length ? [...sorted].reverse().map(m => {
    const bs = books.filter(b => b.meeting_id === m.id).sort((a,b) => a.title.localeCompare(b.title, "de"));
    const nc = notes.filter(n => n.meeting_id === m.id).length;
    return `<li class="meet ${m.date >= t ? "upcoming" : ""}">
      <div>
        <div class="label">${m.date >= t ? "Geplant" : "Stattgefunden"}</div>
        <div class="d">${esc(fmt(m.date))}${m.time ? ", " + esc(m.time) + " Uhr" : ""}</div>
        ${(m.attendees||[]).length ? `<div class="muted">${esc(m.attendees.join(", "))}</div>` : ""}
        ${m.note ? `<p class="n">${esc(m.note)}</p>` : ""}
        ${bs.length ? `<ul>${bs.map(b => `<li>${esc(b.title)} <span class="muted">(${esc(b.author)}${b.presented_by ? ", " + esc(b.presented_by) : ""})</span></li>`).join("")}</ul>` : ""}
        ${nc ? `<button class="link" data-show="${esc(m.id)}" style="margin-top:6px">${nc} ${nc === 1 ? "Notiz" : "Notizen"} ansehen</button>` : ""}
      </div>
      <div><button class="link" data-medit="${esc(m.id)}">Bearbeiten</button></div>
    </li>`;
  }).join("") : `<li class="empty">Noch keine Treffen eingetragen.</li>`;
}

// ---- Buchsuche (Google Books), während des Tippens ----
let findTimer = null, findSeq = 0;
function findBook(){
  clearTimeout(findTimer);
  const q = $("bTitle").value.trim(), box = $("bSugg");
  if (q.length < 3){ box.hidden = true; return; }
  findTimer = setTimeout(async () => {
    const seq = ++findSeq;
    try {
      const r = await fetch("https://www.googleapis.com/books/v1/volumes?maxResults=8&printType=books&langRestrict=de&q=" + encodeURIComponent("intitle:" + q));
      const j = await r.json(); if (seq !== findSeq) return;
      const seen = new Set(), list = [];
      for (const it of j.items || []){
        const v = it.volumeInfo || {}, x = { title: v.title || "", author: (v.authors || []).join(", "), year: (v.publishedDate || "").slice(0,4) };
        const k = (x.title + "|" + x.author).toLowerCase();
        if (x.title && !seen.has(k)){ seen.add(k); list.push(x); }
        if (list.length === 5) break;
      }
      if (!list.length){ box.hidden = true; return; }
      box.hidden = false;
      box.innerHTML = `<span class="label">Vorschläge</span>` + list.map((x, i) =>
        `<div class="sugg"><button type="button" data-pick="${i}"><b>${esc(x.title)}</b><br><span class="muted">${esc(x.author)}${x.year ? " · " + esc(x.year) : ""}</span></button><a href="${amazon(x.title, x.author)}" target="_blank" rel="noopener">Amazon</a></div>`).join("");
      box.querySelectorAll("[data-pick]").forEach(b => b.addEventListener("click", () => {
        const x = list[b.dataset.pick]; $("bTitle").value = x.title; $("bAuthor").value = x.author; box.hidden = true;
      }));
    } catch { if (seq === findSeq) box.hidden = true; }
  }, 350);
}
$("bTitle").addEventListener("input", findBook);

// ---- Dialoge ----
function openBook(b){
  editBook = b || null;
  $("bookDlgTitle").textContent = b ? "Buch bearbeiten" : "Buch eintragen";
  $("bMeet").innerHTML = `<option value="">kein Treffen</option>` + [...meets].sort((a,c) => c.date.localeCompare(a.date)).map(m => `<option value="${esc(m.id)}">${esc(short(m.date))}</option>`).join("");
  $("bTitle").value = b?.title || ""; $("bAuthor").value = b?.author || "";
  $("bStatus").value = b?.status || "vorgestellt"; $("bBy").value = b ? (b.presented_by || "") : me;
  $("bMeet").value = b ? (b.meeting_id || "") : (liveId || "");
  $("bOwner").value = b ? (b.owner || "") : me; $("bLoanTo").value = b?.loaned_to || "";
  $("bLoanSince").value = b?.loaned_since || ""; $("bNote").value = b?.note || "";
  $("bSugg").hidden = true; resetDel($("bDel"), !b); $("bookDlg").showModal();
}
function openMeet(m){
  editMeet = m || null;
  $("meetDlgTitle").textContent = m ? "Treffen bearbeiten" : "Treffen eintragen";
  $("mDate").value = m?.date || ""; $("mTime").value = m?.time || "";
  $("mWho").value = (m?.attendees || MEMBERS).join(", "); $("mNote").value = m?.note || "";
  resetDel($("mDel"), !m); $("meetDlg").showModal();
}
function resetDel(btn, hide){ btn.hidden = hide; btn.textContent = "Löschen"; btn.dataset.armed = ""; }
function armDel(btn, fn){
  if (!btn.dataset.armed){ btn.dataset.armed = "1"; btn.textContent = "Wirklich löschen?"; return; }
  fn();
}

$("bookForm").addEventListener("submit", async e => {
  e.preventDefault();
  const loaned_to = $("bLoanTo").value.trim();
  const data = {
    title: $("bTitle").value.trim(), author: $("bAuthor").value.trim(), status: $("bStatus").value,
    presented_by: $("bBy").value.trim(), meeting_id: $("bMeet").value || null, owner: $("bOwner").value.trim(),
    loaned_to, loaned_since: loaned_to ? ($("bLoanSince").value || today()) : null, note: $("bNote").value.trim()
  };
  const p = editBook ? sb.from("books").update(data).eq("id", editBook.id) : sb.from("books").insert(data);
  $("bookDlg").close(); await run(p, "Buch konnte nicht gespeichert werden.");
});
$("meetForm").addEventListener("submit", async e => {
  e.preventDefault();
  const data = { date: $("mDate").value, time: $("mTime").value, note: $("mNote").value.trim(),
    attendees: $("mWho").value.split(",").map(s => s.trim()).filter(Boolean) };
  const p = editMeet ? sb.from("meetings").update(data).eq("id", editMeet.id) : sb.from("meetings").insert(data);
  $("meetDlg").close(); await run(p, "Treffen konnte nicht gespeichert werden.");
});
$("noteForm").addEventListener("submit", async e => {
  e.preventDefault();
  const body = $("noteText").value.trim(); if (!body || !liveId) return;
  if (await run(sb.from("notes").insert({ meeting_id: liveId, author: me, body }), "Notiz konnte nicht gespeichert werden.")) $("noteText").value = "";
});
$("bDel").addEventListener("click", () => armDel($("bDel"), () => { $("bookDlg").close(); run(sb.from("books").delete().eq("id", editBook.id), "Buch konnte nicht gelöscht werden."); }));
$("mDel").addEventListener("click", () => armDel($("mDel"), () => { $("meetDlg").close(); run(sb.from("meetings").delete().eq("id", editMeet.id), "Treffen konnte nicht gelöscht werden."); }));
document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => b.closest("dialog").close()));
$("addBook").addEventListener("click", () => openBook());
$("addMeet").addEventListener("click", () => openMeet());
$("q").addEventListener("input", render);
$("liveMeet").addEventListener("change", () => { liveId = $("liveMeet").value; render(); });
document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => { filter = c.dataset.f; store.set("ss-filter", filter); render(); }));
document.addEventListener("click", e => {
  const el = e.target.closest("[data-edit],[data-medit],[data-back],[data-ndel],[data-show]"); if (!el) return;
  const d = el.dataset;
  if (d.edit) openBook(books.find(b => b.id === d.edit));
  else if (d.medit) openMeet(meets.find(m => m.id === d.medit));
  else if (d.show){ liveId = d.show; render(); $("liveMeet").scrollIntoView({behavior:"smooth", block:"center"}); }
  else if (d.back){ el.disabled = true; run(sb.from("books").update({loaned_to:"", loaned_since:null}).eq("id", d.back), "Rückgabe konnte nicht gespeichert werden."); }
  else if (d.ndel){
    if (!el.dataset.armed){ el.dataset.armed = "1"; el.textContent = "wirklich löschen?"; return; }
    run(sb.from("notes").delete().eq("id", d.ndel), "Notiz konnte nicht gelöscht werden.");
  }
});

// ---- Anmeldung ----
let channel = null;
async function start(){
  $("login").hidden = true; $("app").hidden = false;
  await load();
  if (!channel) channel = sb.channel("klub").on("postgres_changes", {event:"*", schema:"public"}, () => load()).subscribe();
}
function showLogin(msg){
  $("app").hidden = true; $("login").hidden = false; $("lName").value = me; $("lErr").textContent = msg || "";
  $("people").innerHTML = MEMBERS.map(p => `<option value="${esc(p)}">`).join("");
}
$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  me = $("lName").value.trim(); store.set("ss-name", me);
  const { error } = await sb.auth.signInWithPassword({ email: CLUB_EMAIL, password: $("lPass").value });
  if (error) { $("lErr").textContent = (/invalid login/i.test(error.message) ? "E-Mail oder Passwort stimmen nicht mit dem Klub-Konto überein" : /not confirmed/i.test(error.message) ? "Das Klub-Konto ist in Supabase noch nicht bestätigt" : "Anmeldung fehlgeschlagen") + " (" + CLUB_EMAIL + ": " + error.message + ")"; return; }
  $("lPass").value = ""; start();
});
$("logout").addEventListener("click", async () => { await sb.auth.signOut(); showLogin(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && sb && !$("app").hidden) load(); });

(async () => {
  if (!configured){ showLogin("Die App ist noch nicht eingerichtet: In index.html fehlen Supabase-URL und Key."); $("loginForm").querySelector("button").disabled = true; return; }
  const { data } = await sb.auth.getSession();
  if (data.session && me) start(); else showLogin();
})();
</script>
